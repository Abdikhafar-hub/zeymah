kind = "web"
previewPath = "/"
title = "Zeymah Premium Storefront"
description = "A premium modest-fashion storefront with editorial merchandising, collection browsing, product detail pages, search, wishlist, cart interactions, and responsive layouts for Zeymah."
version = "1.0.0"
id = "artifacts/zeymah-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18767

[services.development]
run = "pnpm --filter @workspace/zeymah-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zeymah-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/zeymah-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18767"
BASE_PATH = "/"
